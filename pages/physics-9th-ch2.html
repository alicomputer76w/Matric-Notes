    { q: "A wagon is moving on the road with a velocity of 54 km h⁻¹. Brakes are applied suddenly. The wagon covers a distance of 25 m before stopping. Determine the acceleration of the wagon.",

    { q: "A stone is dropped from a height of 45 m. How long will it take to reach the ground? What will be its velocity just before hitting the ground?",

function showSection(type, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let html = '<h2 class="section-title">'+sectionTitles[type]+'</h2>';

  if(type === 'mcqs'){
    if(!chapterData.mcqs.length) html += '<div class="empty">No questions added yet.</div>';
    chapterData.mcqs.forEach((m,i)=>{
      html += `<div class="q-card">
        <div class="q-title"><span class="q-num">${i+1}</span><span>${m.q}</span></div>
        <div class="options">
          ${m.options.map((op,j)=>`<div class="option ${j===m.correct?'correct':''}">${String.fromCharCode(65+j)}. ${op} ${j===m.correct?'✔':''}</div>`).join('')}
        </div>
      </div>`;
    });
  } else {
    const list = chapterData[type];
    if(!list.length) html += '<div class="empty">Is section mai abhi questions add nahi ki gayi.</div>';
    list.forEach((s,i)=>{
      const body = s.ans || s.solution;
      const label = (type === 'numerical') ? 'Solution:' : 'Answer:';
      html += `<div class="q-card">
        <div class="q-title"><span class="q-num">${i+1}</span><span>${s.q}</span></div>
        ${body ? `<div class="answer-box"><b>${label}</b> ${body}</div>` : ''}
      </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

showSection('mcqs', document.querySelector('.tab-btn'));
