<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chapter 1 - Physical Quantities and Measurement | 9th Physics | EduPortal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
body{background:#f3f4f6;color:#1f2937;padding-bottom:60px}
.navbar{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 40px;box-shadow:0 2px 10px rgba(0,0,0,.07);position:sticky;top:0;z-index:100}
.logo{font-size:22px;font-weight:700;color:#4f46e5;text-decoration:none}
.nav-right{display:flex;align-items:center;gap:25px}
.nav-right a{color:#374151;text-decoration:none;font-weight:600;font-size:15px}
.nav-right a.active{color:#4f46e5}
.premium-btn{background:#db2777;color:#fff !important;padding:10px 22px;border-radius:50px;font-weight:700}
.strip{height:12px;background:#4f46e5}
.container{max-width:950px;margin:0 auto;padding:25px 15px}
.back-link{display:inline-block;margin-bottom:15px;color:#4f46e5;text-decoration:none;font-weight:600}
.ch-header{background:#fff;border-radius:14px;padding:20px 25px;display:flex;align-items:center;gap:15px;box-shadow:0 3px 10px rgba(0,0,0,.06);margin-bottom:25px}
.ch-num{width:45px;height:45px;background:#4f46e5;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.ch-header h1{font-size:20px;color:#111827}
.tabs{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}
.tab-btn{padding:12px 22px;border:2px solid #c7d2fe;background:#fff;color:#4f46e5;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px;transition:.2s}
.tab-btn:hover{background:#eef2ff}
.tab-btn.active{background:#4f46e5;color:#fff;border-color:#4f46e5}
.q-card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 6px rgba(0,0,0,.05);border-left:5px solid #4f46e5}
.q-title{font-size:16px;font-weight:600;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.q-num{background:#eef2ff;color:#4f46e5;font-weight:700;min-width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.options{margin:12px 0 0 38px;display:grid;gap:8px}
.option{padding:10px 14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:8px;font-size:14px}
.option.correct{background:#dcfce7;border-color:#22c55e;color:#166534;font-weight:700}
.answer-box{margin:12px 0 0 38px;background:#eef2ff;border:1px dashed #6366f1;padding:12px 15px;border-radius:8px;font-size:14px;white-space:pre-line}
.answer-box b{color:#4f46e5}
.section-title{text-align:center;color:#4f46e5;margin-bottom:15px;font-size:18px}
@media(max-width:600px){.navbar{padding:12px 15px}.nav-right{gap:12px}.nav-right a{font-size:13px}}
</style>
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo">📘 EduPortal</a>
  <div class="nav-right">
    <a href="../index.html">Home</a>
    <a href="physics-9th.html" class="active">9th Class</a>
    <a href="../index.html" class="premium-btn">Go Premium</a>
  </div>
</nav>
<div class="strip"></div>

<div class="container">
  <a class="back-link" href="physics-9th.html">← Back to Chapters</a>

  <div class="ch-header">
    <div class="ch-num">1</div>
    <h1>Physical Quantities and Measurement</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn" onclick="showSection('mcqs',this)">MCQs</button>
    <button class="tab-btn" onclick="showSection('short',this)">Short Questions</button>
    <button class="tab-btn" onclick="showSection('long',this)">Long Questions</button>
    <button class="tab-btn" onclick="showSection('numerical',this)">Numericals</button>
  </div>

  <div id="content"></div>
</div>

<script>
/* =====================================================
   👇 YAHAN APNA DATA PASTE KAREIN (har chapter k liye alag file)
   mcqs      -> q: question, options: [4 options], correct: 0/1/2/3 (sahi jawab ka index)
   short     -> q: question, ans: answer (optional)
   long      -> q: question, ans: answer (optional)
   numerical -> q: question, solution: hal
===================================================== */
const chapterData = {

  mcqs: [
    { q: "Which of the following is a base quantity?",
      options: ["Speed", "Distance", "Time", "Force"],
      correct: 2 },
    { q: "One litre is equal to:",
      options: ["100 mL", "1000 mL", "10 mL", "10000 mL"],
      correct: 1 }
  ],

  short: [
    { q: "Define physics and write its scope.", ans: "" },
    { q: "Difference between base and derived quantities?" }
  ],

  long: [
    { q: "Explain the International System of Units (SI).", ans: "" }
  ],

  numerical: [
    { q: "Convert 1.5 kg into grams.",
      solution: "1 kg = 1000 g\n1.5 kg = 1.5 × 1000 = 1500 g" }
  ]

};
/* ================= DATA END ================= */

function showSection(type, btn){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  let html = '';

  if(type === 'mcqs'){
    html += '<h2 class="section-title">Multiple Choice Questions</h2>';
    chapterData.mcqs.forEach((m,i)=>{
      html += `<div class="q-card">
        <div class="q-title"><span class="q-num">${i+1}</span><span>${m.q}</span></div>
        <div class="options">
          ${m.options.map((op,j)=>`<div class="option ${j===m.correct?'correct':''}">${String.fromCharCode(65+j)}. ${op} ${j===m.correct?'✔':''}</div>`).join('')}
        </div>
      </div>`;
    });
  }
  else if(type === 'short' || type === 'long'){
    const list = chapterData[type];
    html += '<h2 class="section-title">'+(type==='short'?'Short Questions':'Long Questions')+'</h2>';
    list.forEach((s,i)=>{
      html += `<div class="q-card">
        <div class="q-title"><span class="q-num">${i+1}</span><span>${s.q}</span></div>
        ${s.ans ? `<div class="answer-box"><b>Answer:</b> ${s.ans}</div>` : ''}
      </div>`;
    });
  }
  else{
    html += '<h2 class="section-title">Numerical Problems</h2>';
    chapterData.numerical.forEach((n,i)=>{
      html += `<div class="q-card">
        <div class="q-title"><span class="q-num">${i+1}</span><span>${n.q}</span></div>
        ${n.solution ? `<div class="answer-box"><b>Solution:</b> ${n.solution}</div>` : ''}
      </div>`;
    });
  }
  document.getElementById('content').innerHTML = html;
}

// Tabs pe count lagao + page khulty hi MCQs show karo
const counts = [chapterData.mcqs.length, chapterData.short.length, chapterData.long.length, chapterData.numerical.length];
document.querySelectorAll('.tab-btn').forEach((b,i)=> b.textContent += ` (${counts[i]})`);
showSection('mcqs', document.querySelector('.tab-btn'));
</script>
</body>
</html>
