<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduPortal Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{background:#f0f2f5;padding:20px}
.container{max-width:700px;margin:30px auto;background:#fff;border-radius:12px;padding:30px;box-shadow:0 4px 20px rgba(0,0,0,.08)}
h1{color:#4361ee;margin-bottom:20px;font-size:1.5rem}
.hidden{display:none}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:6px;font-weight:600;font-size:.9rem;color:#2b2d42}
input,select,textarea{width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:8px;font-size:.95rem}
textarea{min-height:80px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.btn{width:100%;padding:12px;background:#4361ee;color:#fff;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer}
.btn:hover{background:#3f37c9}
.btn-logout{width:auto;padding:8px 20px;background:#f5576c}
.msg{padding:10px;border-radius:8px;margin-bottom:15px;display:none;font-size:.9rem}
.msg.success{background:#d4edda;color:#155724;display:block}
.msg.error{background:#f8d7da;color:#721c24;display:block}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.recent{margin-top:30px;border-top:2px solid #eee;padding-top:20px}
.recent-item{background:#f8f9fa;padding:10px;border-radius:8px;margin-bottom:8px;font-size:.85rem}
.tag{display:inline-block;background:#4361ee;color:#fff;padding:2px 8px;border-radius:20px;font-size:.7rem;margin-right:5px}
</style>
</head>
<body>

<!-- LOGIN SECTION -->
<div class="container" id="loginSection">
  <h1>🔐 EduPortal Admin Login</h1>
  <div class="msg" id="loginMsg"></div>
  <form id="adminLoginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="adminEmail" required placeholder="Admin email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPassword" required placeholder="Password">
    </div>
    <button type="submit" class="btn">Login</button>
  </form>
</div>

<!-- ADMIN PANEL -->
<div class="container hidden" id="adminSection">
  <div class="header">
    <h1>📚 Admin Panel</h1>
    <button class="btn btn-logout" id="logoutBtn">Logout</button>
  </div>
  <div class="msg" id="adminMsg"></div>

  <form id="questionForm">
    <div class="row">
      <div class="form-group">
        <label>Class</label>
        <select id="qClass" required>
          <option value="9th">9th Class</option>
          <option value="10th">10th Class</option>
        </select>
      </div>
      <div class="form-group">
        <label>Subject</label>
        <select id="qSubject" required>
          <option value="math">Mathematics</option>
          <option value="english">English</option>
          <option value="urdu">Urdu</option>
          <option value="physics">Physics</option>
          <option value="chemistry">Chemistry</option>
          <option value="biology">Biology</option>
          <option value="computer">Computer</option>
          <option value="islamiat">Islamiat</option>
          <option value="pak-studies">Pak Studies</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Chapter #</label>
        <input type="number" id="qChapter" min="1" required placeholder="1">
      </div>
      <div class="form-group">
        <label>Chapter Name</label>
        <input type="text" id="qChapterName" required placeholder="e.g. Matrices">
      </div>
    </div>

    <div class="form-group">
      <label>Content Type</label>
      <select id="qType" required>
        <option value="mcq">MCQ</option>
        <option value="short">Short Question</option>
        <option value="long">Long Question</option>
      </select>
    </div>

    <div class="form-group">
      <label>Question</label>
      <textarea id="qQuestion" required placeholder="Sawal likhein..."></textarea>
    </div>

    <!-- MCQ Options (sirf MCQ type par) -->
    <div id="mcqFields">
      <div class="row">
        <div class="form-group"><label>Option A</label><input type="text" id="optA"></div>
        <div class="form-group"><label>Option B</label><input type="text" id="optB"></div>
      </div>
      <div class="row">
        <div class="form-group"><label>Option C</label><input type="text" id="optC"></div>
        <div class="form-group"><label>Option D</label><input type="text" id="optD"></div>
      </div>
      <div class="form-group">
        <label>Correct Answer</label>
        <select id="qCorrect">
          <option value="A">A</option><option value="B">B</option>
          <option value="C">C</option><option value="D">D</option>
        </select>
      </div>
    </div>

    <!-- Answer (short/long type par) -->
    <div id="answerField" class="hidden">
      <div class="form-group">
        <label>Answer</label>
        <textarea id="qAnswer" placeholder="Jawab likhein..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn" id="submitBtn">➕ Add Question</button>
  </form>

  <div class="recent">
    <h1 style="font-size:1.1rem">🕒 Recently Added (Last 10)</h1>
    <div id="recentList"><p style="color:#888;font-size:.85rem">Loading...</p></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, addDoc, collection, getDocs, limit, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD4OjgT03bWh3oGwZ4TpLt5ndnJl2B2YWs",
  authDomain: "general-59069.firebaseapp.com",
  projectId: "general-59069",
  storageBucket: "general-59069.firebasestorage.app",
  messagingSenderId: "1025337426123",
  appId: "1:1025337426123:web:6d5d7ebfa26e64c0ae5b4e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const loginSection = document.getElementById('loginSection');
const adminSection = document.getElementById('adminSection');

function showMsg(id, text, type){
  const el = document.getElementById(id);
  el.className = 'msg ' + type;
  el.innerText = text;
  setTimeout(()=>{ el.className='msg'; }, 4000);
}

// ---- AUTH CHECK (Admin hai ya nahi) ----
onAuthStateChanged(auth, async (user) => {
  if (user) {
    try {
      const uSnap = await getDoc(doc(db, 'users', user.uid));
      if (uSnap.exists() && uSnap.data().role === 'admin') {
        loginSection.classList.add('hidden');
        adminSection.classList.remove('hidden');
        loadRecent();
        return;
      }
    } catch(e){}
    showMsg('loginMsg', '❌ Yeh account admin nahi hai!', 'error');
    signOut(auth);
  }
});

// ---- LOGIN ----
document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await signInWithEmailAndPassword(auth,
      document.getElementById('adminEmail').value,
      document.getElementById('adminPassword').value);
  } catch (err) {
    showMsg('loginMsg', '❌ Ghalat email ya password!', 'error');
  }
});

// ---- LOGOUT ----
document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

// ---- MCQ / Answer Fields Toggle ----
document.getElementById('qType').addEventListener('change', (e) => {
  const isMcq = e.target.value === 'mcq';
  document.getElementById('mcqFields').classList.toggle('hidden', !isMcq);
  document.getElementById('answerField').classList.toggle('hidden', isMcq);
});

// ---- ADD QUESTION ----
document.getElementById('questionForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerText = 'Saving...';

  const type = document.getElementById('qType').value;
  const data = {
    class: document.getElementById('qClass').value,
    subject: document.getElementById('qSubject').value,
    chapter: parseInt(document.getElementById('qChapter').value),
    chapterName: document.getElementById('qChapterName').value.trim(),
    type: type,
    question: document.getElementById('qQuestion').value.trim(),
    createdAt: serverTimestamp()
  };

  if (type === 'mcq') {
    data.options = [
      document.getElementById('optA').value.trim(),
      document.getElementById('optB').value.trim(),
      document.getElementById('optC').value.trim(),
      document.getElementById('optD').value.trim()
    ];
    data.answer = document.getElementById('qCorrect').value;
  } else {
    data.answer = document.getElementById('qAnswer').value.trim();
  }

  try {
    await addDoc(collection(db, 'questions'), data);
    showMsg('adminMsg', '✅ Question successfully add ho gaya!', 'success');
    e.target.reset();
    document.getElementById('mcqFields').classList.remove('hidden');
    document.getElementById('answerField').classList.add('hidden');
    loadRecent();
  } catch (err) {
    showMsg('adminMsg', '❌ Error: ' + err.message, 'error');
  } finally {
    btn.disabled = false; btn.innerText = '➕ Add Question';
  }
});

// ---- RECENT LIST ----
async function loadRecent(){
  try {
    const snap = await getDocs(query(collection(db,'questions'), limit(10)));
    let items = [];
    snap.forEach(d => items.push(d.data()));
    items.sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
    const list = document.getElementById('recentList');
    if (!items.length) { list.innerHTML = '<p style="color:#888;font-size:.85rem">Abhi koi question nahi hai.</p>'; return; }
    list.innerHTML = items.map(i => `
      <div class="recent-item">
        <span class="tag">${i.class}</span><span class="tag">${i.subject}</span>
        <span class="tag">${i.type}</span> Ch.${i.chapter} — ${i.question}
      </div>`).join('');
  } catch(e){
    document.getElementById('recentList').innerHTML = '<p style="color:#888">Loading failed</p>';
  }
}
</script>
</body>
</html>
